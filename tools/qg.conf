# Quality gates — monorepo Chemin A (apps + packages).
# Edit stack.yml quality_gates if present; keep this in sync.
: "${QG_FILE_MAX:=300}"
: "${QG_FILE_ROOTS:=apps packages}"
: "${QG_FILE_EXEMPTIONS:=tools/file_exemptions.txt}"
: "${QG_FILE_METRIC:=raw}"

# Folder density (direct .ts/.tsx children per directory).
# Default 40 — shadcn kit dirs use tools/folder_exemptions.txt for local caps.
: "${QG_FOLDER_MAX:=40}"
: "${QG_FOLDER_ROOTS:=apps packages}"
: "${QG_FOLDER_EXEMPTIONS:=tools/folder_exemptions.txt}"
