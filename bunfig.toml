# Bun install policy (supply chain). Read by `bun install` / `bun add` / `bun update` / `bun remove`
# in this tree. Docs: docs/kit/security-dependabot.md § Install-time layers.
#
# `bun run` / `bun test` / gate launchers are unaffected: gates run with
# `--config=config/kit/bunfig.gates.toml` (deliberately empty) and this file only sets [install].
[install]
# Never resolve a *new* version younger than 3 days (= Dependabot cooldown, seconds).
# Applies to every install path, including an agent's `bun add`.
#
# It also re-checks versions ALREADY in bun.lock (measured, Bun 1.4.0: a locked version
# younger than the gate makes a plain `bun install` / `--frozen-lockfile` fail with
# "No version matching … blocked by minimum-release-age"; Bun's docs say existing lock entries
# are untouched — they are not). So installs that must reproduce an already-reviewed lock pass
# `--minimum-release-age 0`: ci.yml, scripts/kit/cf-builds/install-monorepo.sh, worktree-setup.sh.
# Otherwise a reviewed security update (never delayed by Dependabot's cooldown) would break CI,
# every Workers Build and every new worktree for its first 3 days.
minimumReleaseAge = 259200
