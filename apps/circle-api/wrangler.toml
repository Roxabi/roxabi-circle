name = "roxabi-circle"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Account: Mickael (b5e90be9…) — zone roxabi.dev. Not Tool@gosilex.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "circle.roxabi.dev", custom_domain = true },
]

# Uncomment when D1 is provisioned:
# [[d1_databases]]
# binding = "DB"
# database_name = "roxabi-circle"
# database_id = "REPLACE_ME"

# Uncomment when KV is provisioned:
# [[kv_namespaces]]
# binding = "STATE"
# id = "REPLACE_ME"

[vars]
ENVIRONMENT = "production"
SCORER_VERSION = "0.1.0"
ACCEPT_THRESHOLD = "65"

# Secrets via `wrangler secret` (see .dev.vars.example)
# LYRA_GROK_WEBHOOK_URL + LYRA_GROK_WEBHOOK_SECRET — required to forward @Lyra
# and later human messages in threads where Lyra has already posted.
# LYRA_GITHUB_WATCH_WEBHOOK_URL + LYRA_GITHUB_WATCH_WEBHOOK_SECRET — required to
# forward #github-to-watch repo URLs (separate Grok Bot routine).
# Source: Grok Bot desktop → routine trigger "When a webhook fires" (URL + sender key).

[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1-discord-gateway"
new_sqlite_classes = ["DiscordGateway"]

# */15 = Gateway safety-net. GitHub digest 10:30/11:30 UTC triggers removed
# (Veilleur → Lyra owns #daily-digest). Code also no-ops leftover digest crons.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
