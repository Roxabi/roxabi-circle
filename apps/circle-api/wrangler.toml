name = "roxabi-circle"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Uncomment when D1 is provisioned:
# [[d1_databases]]
# binding = "DB"
# database_name = "roxabi-circle"
# database_id = "REPLACE_ME"

# Uncomment when KV is provisioned:
# [[kv_namespaces]]
# binding = "STATE"
# id = "REPLACE_ME"

[vars]
ENVIRONMENT = "production"
SCORER_VERSION = "0.1.0"
ACCEPT_THRESHOLD = "65"

# Public non-secret Discord IDs (safe as vars). Tokens via `wrangler secret`.
# DISCORD_APPLICATION_ID / GUILD_ID / MEMBER_ROLE_ID / APPEAL_CATEGORY_ID set as secrets bulk for simplicity.
# DISCORD_GITHUB_WATCH_CHANNEL_ID — set via secret or .dev.vars (channel #github-to-watch)

[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1-discord-gateway"
new_sqlite_classes = ["DiscordGateway"]

# Keep Gateway DO warm / reconnect if socket dropped
[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true
