# Local quality gates — see AGENTS.md § Gates techniques
# Install: bun install (prepare)  or  bunx lefthook install
# Skip (emergency only): LEFTHOOK=0 git push

pre-commit:
  parallel: true
  commands:
    biome:
      # Format + lint staged only (fast)
      run: bunx biome check --write --staged --no-errors-on-unmatched --files-ignore-unknown=true
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# Full suite before code leaves the machine.
# validate = lint/typecheck/test/banlist/extract
# test:coverage = Vitest thresholds (API 80%, UI/web lower floors)
pre-push:
  parallel: false
  commands:
    validate:
      skip: false
      run: bun run validate
    coverage:
      skip: false
      run: bun run test:coverage
