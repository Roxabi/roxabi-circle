# Local quality gates — PRIMARY gate (CI is guardrail only).
# SSoT: docs/testing.md · AGENTS.md § Gates techniques
# Install: bun install (prepare)  or  bunx lefthook install
# Skip (emergency only, document why): LEFTHOOK=0 git push
# Policy: fix red HERE — do not push hoping CI will catch it.

pre-commit:
  parallel: true
  commands:
    biome:
      # Format + lint staged only (fast)
      run: bunx biome check --write --staged --no-errors-on-unmatched --files-ignore-unknown=true
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# Full suite before code leaves the machine (= validate:full).
# Intentional cost: local SoT; CI re-runs as guardrail (skip hooks / env drift).
# validate:full = lint · typecheck · banlist · extract · env · test:coverage · license
# (no separate turbo `test` — coverage suites are the test gate)
pre-push:
  parallel: false
  commands:
    validate-full:
      skip: false
      run: bun run validate:full
