# Local quality gates — PRIMARY gate (CI is guardrail only).
# SSoT: docs/testing.md · AGENTS.md § Gates techniques · docs/product-consumer-contract.md
# Install: bun install (prepare)  or  bunx lefthook install
# Skip (emergency only, document why): LEFTHOOK=0 git push
# Policy: fix red HERE — do not push hoping CI will catch it.
#
# Product forks: DO NOT edit this file. deny-upstream is kit-safe (no-op on the kit repo).

pre-commit:
  parallel: true
  commands:
    biome:
      # Format + lint staged only (fast)
      run: bunx biome check --write --staged --no-errors-on-unmatched --files-ignore-unknown=true
      stage_fixed: true
    file-length:
      # Staged TS/TSX only under apps/ + packages/ (max 300; tools/file_exemptions.txt)
      run: QG_FILE_MODE=staged bash tools/check_file_length.sh

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# Full suite before code leaves the machine (= validate:full).
# Intentional cost: local SoT; CI re-runs as guardrail (skip hooks / env drift).
# validate:full = lint · typecheck · banlist · extract · zero-edit · env · test:coverage · license
#                 · quality-gates (file length) · build:kit · smoke:mcp
# zero-edit: product must not dual-edit kit paths (see docs/product-consumer-contract.md)
# (no separate turbo `test` for all pkgs — coverage suites are the unit gate)
pre-push:
  parallel: false
  commands:
    # Product consumers: block push to kit upstream. Kit origin = no-op.
    deny-upstream:
      skip: false
      run: bash scripts/deny-upstream-push.sh {1} {2}
    validate-full:
      skip: false
      run: bun run validate:full
