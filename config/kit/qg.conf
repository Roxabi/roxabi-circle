# Quality gates — monorepo Chemin A (apps + packages).
# Edit stack.yml quality_gates if present; keep this in sync.
: "${QG_FILE_MAX:=300}"
: "${QG_FILE_ROOTS:=apps packages}"
: "${QG_FILE_EXEMPTIONS:=config/kit/file_exemptions.txt}"
: "${QG_FILE_PRODUCT_EXEMPTIONS:=config/product/file_exemptions.txt}"
: "${QG_FILE_METRIC:=raw}"

# Folder density (direct .ts/.tsx children per directory).
# Default 40 — shadcn kit dirs use config/kit/folder_exemptions.txt for local caps.
# Product caps: config/product/folder_exemptions.txt (optional).
: "${QG_FOLDER_MAX:=40}"
: "${QG_FOLDER_ROOTS:=apps packages}"
: "${QG_FOLDER_EXEMPTIONS:=config/kit/folder_exemptions.txt}"
: "${QG_FOLDER_PRODUCT_EXEMPTIONS:=config/product/folder_exemptions.txt}"
