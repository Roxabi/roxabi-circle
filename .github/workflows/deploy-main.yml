name: Deploy main

# RETIRED — kit showcase CD is Cloudflare Builds (git pull + build on CF).
# See docs/kit/deploy-cloudflare.md and scripts/kit/cf-builds/.
#
# This workflow is kept as a no-op so old workflow_run subscriptions and docs links
# do not confuse operators. It never deploys.
#
# Break-glass: docs/kit/deploy-cloudflare.md § Break-glass (production ships from deploy/main,
# moved by the Deploy gate; see deploy-gate.yml).

on:
  workflow_dispatch:
    inputs:
      notice:
        description: 'No-op — use Cloudflare Builds or laptop scripts (docs/kit/deploy-cloudflare.md)'
        type: string
        required: false
        default: 'see docs/kit/deploy-cloudflare.md'

permissions:
  contents: read

jobs:
  retired:
    name: retired-use-cloudflare-builds
    runs-on: ubuntu-latest
    steps:
      - name: Point operators at CF Builds
        run: |
          echo "::notice::Showcase CD is Cloudflare Builds, not GitHub Actions."
          echo "Docs: docs/kit/deploy-cloudflare.md"
          echo "Scripts: scripts/kit/cf-builds/"
          exit 0
