# Secret scan — S0 gate (no app build required).
# Blocks PR/push if TruffleHog finds verified secrets.
# Aligns with AGENTS.md § Sécurité & bon usage de l’IA.
name: Secret scan

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  # Never cancel an in-flight security scan for the same ref
  cancel-in-progress: false

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so renamed/rebased secrets still surface
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Verified findings only — reduces noise from high-entropy false positives
          extra_args: --only-verified
