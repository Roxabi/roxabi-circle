# Secret scan — secondary filet (local scripts/trufflehog-check.sh is primary).
# Diff-scoped PR/push + shared exclude list. Aligns with AGENTS.md § Sécurité.
name: Secret scan

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Exclude file must live under the workspace: TruffleHog action runs in Docker
      # with only the repo mounted (RUNNER_TEMP is not visible → exit 1).
      - name: Build exclude list (strip # comments)
        run: |
          set -euo pipefail
          if [ -f scripts/trufflehog-exclude-paths.txt ]; then
            grep -vE '^\s*(#|$)' scripts/trufflehog-exclude-paths.txt \
              > trufflehog-exclude.txt
          else
            echo 'node_modules' > trufflehog-exclude.txt
            echo '::warning::scripts/trufflehog-exclude-paths.txt missing — node_modules only'
          fi

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          # Diff only (PR base…head, or push before…sha)
          base: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Local primary: scripts/trufflehog-check.sh (same exclude SSoT)
          # Relative path = inside Docker workdir (/tmp = checkout)
          extra_args: --only-verified --exclude-paths=trufflehog-exclude.txt

      # Second pass, deliberately WITHOUT --only-verified.
      # A `sk_` key this kit mints has no third-party API to verify against, so it is always
      # an *unverified* finding and the step above discards it silently. Scoped to our own
      # detectors, which measure 0 findings on a clean tree — so this stays quiet until a
      # real key actually lands. Rationale + measurements: scripts/trufflehog-detectors.yaml
      - name: TruffleHog kit-issued secret scan (unverifiable by design)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --config=scripts/trufflehog-detectors.yaml --fail --exclude-paths=trufflehog-exclude.txt
