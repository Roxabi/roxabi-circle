# Secret scan — secondary filet (local scripts/kit/trufflehog-check.sh is primary).
# Same introduced-commit range computation as the local hook (Roxabi/roxabi-boilerplate-cf#284). Never the
# action's base/head walk (TruffleHog --since-commit stop-marker hole).
# Pin SSoT: config/kit/trufflehog.version (binary v3.97.1).
name: Secret scan

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

# One group per pushed SHA: a pending scan is never replaced by the next push, whose own scan
# covers only its diff. Every push is scanned, and the Deploy gate refuses to ship past a red one (Roxabi/roxabi-boilerplate-cf#256).
concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert pin (script-owned; no action uses)
        run: bash scripts/kit/trufflehog-check.sh --assert-pin

      # Force-push: `github.event.before` names the pre-rewrite tip, which may be
      # unreachable. Empty base → full scan (more coverage, never less). Roxabi/roxabi-boilerplate-cf#54
      - name: Resolve scan base
        id: scan_base
        run: |
          set -euo pipefail
          pr_base='${{ github.event.pull_request.base.sha }}'
          before='${{ github.event.before }}'
          forced='${{ github.event.forced }}'
          zero='0000000000000000000000000000000000000000'
          if [ -n "$pr_base" ]; then
            echo "base=$pr_base" >> "$GITHUB_OUTPUT"
          elif [ "$forced" = "true" ] || [ -z "$before" ] || [ "$before" = "$zero" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "base=$before" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: TruffleHog introduced-commit scan (shared script)
        env:
          THOG_RANGE_BASE: ${{ steps.scan_base.outputs.base }}
          THOG_RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/kit/trufflehog-check.sh --commits-only
