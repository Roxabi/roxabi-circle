# Secret scan — secondary filet (local scripts/kit/trufflehog-check.sh is primary).
# Diff-scoped PR/push + shared exclude list. Aligns with AGENTS.md § Sécurité.
name: Secret scan

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert action pin matches config/kit/trufflehog.version
        run: bash scripts/kit/trufflehog-check.sh --assert-pin

      # Exclude file must live under the workspace: TruffleHog action runs in Docker
      # with only the repo mounted (RUNNER_TEMP is not visible → exit 1).
      - name: Build exclude list (strip # comments)
        run: |
          set -euo pipefail
          if [ -f scripts/kit/trufflehog-exclude-paths.txt ]; then
            grep -vE '^\s*(#|$)' scripts/kit/trufflehog-exclude-paths.txt \
              > trufflehog-exclude.txt
          else
            echo 'node_modules' > trufflehog-exclude.txt
            echo '::warning::scripts/kit/trufflehog-exclude-paths.txt missing — node_modules only'
          fi
      # Force-push: `github.event.before` names the pre-rewrite tip, which may be
      # unreachable. Empty base → full scan (more coverage, never less). #54
      - name: Resolve scan base
        id: scan_base
        run: |
          set -euo pipefail
          pr_base='${{ github.event.pull_request.base.sha }}'
          before='${{ github.event.before }}'
          forced='${{ github.event.forced }}'
          zero='0000000000000000000000000000000000000000'
          if [ -n "$pr_base" ]; then
            echo "base=$pr_base" >> "$GITHUB_OUTPUT"
          elif [ "$forced" = "true" ] || [ -z "$before" ] || [ "$before" = "$zero" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "base=$before" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi


      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          # Diff only (PR base…head, or push before…sha). Empty = full scan.
          base: ${{ steps.scan_base.outputs.base }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Local primary: scripts/kit/trufflehog-check.sh (same exclude SSoT)
          # Relative path = inside Docker workdir (/tmp = checkout)
          extra_args: --only-verified --exclude-paths=trufflehog-exclude.txt

      # Second pass, deliberately WITHOUT --only-verified.
      # A `sk_` key this kit mints has no third-party API to verify against, so it is always
      # an *unverified* finding and the step above discards it silently. Scoped to our own
      # detectors, which measure 0 findings on a clean tree — so this stays quiet until a
      # real key actually lands. Rationale + measurements: scripts/kit/trufflehog-detectors.yaml
      #
      # Do NOT add --fail here: the action's own docker invocation already passes
      # `--fail --no-update --github-actions` (action.yml at the pinned SHA), and TruffleHog
      # rejects a repeated flag — `error: flag 'fail' cannot be repeated` → exit 1 before any
      # scanning happens. Failing on findings therefore depends on a flag we do not control;
      # re-verify it when bumping the pin.
      - name: TruffleHog kit-issued secret scan (unverifiable by design)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ steps.scan_base.outputs.base }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --config=scripts/kit/trufflehog-detectors.yaml --exclude-paths=trufflehog-exclude.txt
