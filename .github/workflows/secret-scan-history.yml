# Full-history secret scan — the gap the diff-scoped scans structurally cannot close.
#
# `secret-scan.yml` and `scripts/trufflehog-check.sh` are both diff-scoped (PR base…head, or
# commits after the origin base). That is the right trade for the PR path — it stays fast —
# but it means a secret can evade both:
#   * committed then removed by an amend/force-push, so it falls outside base…head
#   * present in history before these gates existed
#
# Nothing scanned the whole history until this workflow. Scheduled rather than per-PR so the
# cost lands once a week instead of on every push.
#
# Two passes for the same reason as secret-scan.yml: generic detectors keep --only-verified,
# kit-issued `sk_` keys cannot be verified by any third party and need a pass without it.
# See scripts/trufflehog-detectors.yaml for the measurements behind that split.
name: Secret scan (full history)

permissions:
  contents: read

on:
  schedule:
    # Mondays 04:17 UTC — offset off the hour to dodge the scheduler's peak queue.
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

concurrency:
  group: secret-scan-history
  cancel-in-progress: false

jobs:
  trufflehog-history:
    name: TruffleHog (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same Docker constraint as secret-scan.yml: the exclude file must live inside the
      # workspace, since only the repo is mounted into the action container.
      - name: Build exclude list (strip # comments)
        run: |
          set -euo pipefail
          if [ -f scripts/trufflehog-exclude-paths.txt ]; then
            grep -vE '^\s*(#|$)' scripts/trufflehog-exclude-paths.txt \
              > trufflehog-exclude.txt
          else
            echo 'node_modules' > trufflehog-exclude.txt
            echo '::warning::scripts/trufflehog-exclude-paths.txt missing — node_modules only'
          fi

      # No base/head → the action scans the entire repository history.
      - name: TruffleHog full-history scan (generic detectors)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          extra_args: --only-verified --fail --exclude-paths=trufflehog-exclude.txt

      - name: TruffleHog full-history scan (kit-issued secrets)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          extra_args: --config=scripts/trufflehog-detectors.yaml --fail --exclude-paths=trufflehog-exclude.txt
