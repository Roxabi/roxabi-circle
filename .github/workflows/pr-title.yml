name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, staging]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        with:
          types: |
            feat
            fix
            refactor
            docs
            style
            test
            chore
            ci
            perf
            build
            revert
          requireScope: false
          allowMergeCommits: true
          allowRevertCommits: true
          ignoredAuthors: |
            dependabot[bot]
            renovate[bot]
          # A bare #N is ambiguous across the kit and its mirror: no issue number in the scope or the
          # subject. Reference with owner/repo#N in the PR body (Refs: / Closes ...). Same rule as
          # commitlint.config.cjs and `bun run doc:check`.
          disallowScopes: |
            .*#[0-9]+.*
          subjectPattern: '^(?!.*(?<![A-Za-z0-9_])#[0-9]).+$'
          subjectPatternError: "PR title must have a non-empty description after the type/scope prefix and no bare #N issue reference (write owner/repo#N in the PR body, never in the title)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
