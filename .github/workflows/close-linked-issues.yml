# Close issues referenced with closing keywords when a PR merges.
# Split from merge-on-green so that workflow stays on narrow triggers only.
name: Close linked issues

on:
  pull_request:
    types: [closed]
    branches: [main, staging]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    name: Close linked issues
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 5
    steps:
      - name: Close issues referenced with closing keywords
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            // Convention: `Closes owner/repo#N` (a bare `#N` is ambiguous across the kit and its
            // mirror, and is rejected in commits). A bare `#N` still closes in this repository.
            // A qualified ref to another repository is not ours to close.
            const pattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+(?:([\w.-]+\/[\w.-]+))?#(\d+)/gi;
            const here = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const issues = new Set();
            let match;
            while ((match = pattern.exec(body)) !== null) {
              const repo = match[1];
              if (repo && repo.toLowerCase() !== here) {
                core.info(`Skipping ${repo}#${match[2]}: not ${here}`);
                continue;
              }
              issues.add(parseInt(match[2], 10));
            }
            if (issues.size === 0) {
              core.info('No closing keywords found in PR body');
              return;
            }
            for (const number of issues) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  state: 'closed',
                });
                core.info(`Closed #${number}`);
              } catch (e) {
                core.warning(`Could not close #${number}: ${e.message}`);
              }
            }
