# Merge-on-green — Free private org cannot use native branch protection.
# This is process, not enforcement: see docs/kit/testing.md § Merge residual.
# Gate reads use GITHUB_TOKEN; writes use the current-repository CI App installation.
name: Merge on Green

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main, staging]
  pull_request_target:
    types: [labeled, synchronize, reopened]
    branches: [main, staging]
  workflow_run:
    workflows: [Secret scan, CI, Product CI]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate first (optional; every evaluation scans eligible PRs)
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: read
  issues: read

jobs:
  # pull_request runs this file while checkout is the consumer default ref, which may not
  # contain the adapter. That event never authorizes; return before require. Privileged
  # events classify with the existing strict policyFromEnv only.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      trusted_sha: ${{ steps.checkout.outputs.commit }}
      enabled: ${{ steps.validate.outputs.enabled }}
      policy_ready: ${{ steps.validate.outputs.policy_ready }}
    env:
      CI_APP_ID: ${{ vars.CI_APP_ID }}
      HEAD_AUTH_REPOSITORY_ID: ${{ vars.HEAD_AUTH_REPOSITORY_ID }}
      HEAD_AUTH_OPERATOR_IDS: ${{ vars.HEAD_AUTH_OPERATOR_IDS }}
      HEAD_AUTH_APP_ID: ${{ vars.HEAD_AUTH_APP_ID }}
      HEAD_AUTH_BOT_USER_ID: ${{ vars.HEAD_AUTH_BOT_USER_ID }}
    steps:
      - name: Checkout trusted authorization adapter
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/kit/lib/head-authorization.cjs
            /scripts/kit/lib/head-authorization-core.cjs
          sparse-checkout-cone-mode: false
      - name: Validate comment wakeup against GitHub
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'pull_request') return;
            if (context.eventName === 'issue_comment' && !context.payload.issue.pull_request) return;
            const absent = (value) => value == null || value === '';
            const enabled = Boolean(process.env.CI_APP_ID);
            const policyPresent = [
              'HEAD_AUTH_REPOSITORY_ID',
              'HEAD_AUTH_OPERATOR_IDS',
              'HEAD_AUTH_APP_ID',
              'HEAD_AUTH_BOT_USER_ID',
            ].some((key) => !absent(process.env[key]));
            let policy;
            if (enabled || policyPresent) {
              const { policyFromEnv } = require('./scripts/kit/lib/head-authorization.cjs');
              policy = policyFromEnv(process.env);
            }
            core.setOutput('enabled', enabled ? 'true' : 'false');
            core.setOutput('policy_ready', policy ? 'true' : 'false');
            if (context.eventName !== 'issue_comment') { core.setOutput('eligible', 'true'); return; }
            if (!policy) return;
            const { classifyIssuer, PREFIX } = require('./scripts/kit/lib/head-authorization-core.cjs');
            const { data: comment } = await github.rest.issues.getComment({ ...context.repo, comment_id: context.payload.comment.id });
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.issue.number });
            if (comment.issue_url !== context.payload.issue.url || pr.number !== context.payload.issue.number ||
                !comment.body?.startsWith(PREFIX) || !classifyIssuer(comment, policy)) return;
            core.setOutput('eligible', 'true');
  merge-on-green:
    name: merge-on-green
    needs: preflight
    concurrency:
      group: merge-on-green-repository
      cancel-in-progress: false
    if: >-
      needs.preflight.outputs.eligible == 'true' &&
      ((github.event_name == 'workflow_run' ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) ||
       (github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
        (github.event.label.name == 'reviewed' || github.event.label.name == 'deps-automerge') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    runs-on: ubuntu-latest
    # Full retained-event scans and GitHub mergeability reads need recovery time; this is not a capacity claim.
    timeout-minutes: 15
    env:
      HEAD_AUTH_REPOSITORY_ID: ${{ vars.HEAD_AUTH_REPOSITORY_ID }}
      HEAD_AUTH_OPERATOR_IDS: ${{ vars.HEAD_AUTH_OPERATOR_IDS }}
      HEAD_AUTH_APP_ID: ${{ vars.HEAD_AUTH_APP_ID }}
      HEAD_AUTH_BOT_USER_ID: ${{ vars.HEAD_AUTH_BOT_USER_ID }}
    steps:
      - name: Resolve kit-ci availability
        id: cfg
        env:
          APP_ID: ${{ vars.CI_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "kit-ci: App ID present → auto-merge enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=kit-ci not configured::Auto-merge OFF. Evaluation requires a complete head-authorization policy and does not run when that policy is absent. Operator-authorized merge after normal current-head review admission and quality CI still works. Install App + set repo-level CI_APP_ID and CI_APP_PRIVATE_KEY (required on Free private; org values do not reach private repos on Free) — docs/kit/ci-app-setup.md"
            echo "::warning title=Manual merge required::Normal current-head review admission remains required; label reviewed will NOT auto-merge until kit-ci is set up."
          fi

      # Dispatch is reserved for trusted operators on the default ref. An older workflow
      # revision can omit this guard; the preflight checkout fixes the trusted code revision.
      - name: Checkout merge gate module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/kit/lib/merge-gate.cjs
            /scripts/kit/lib/product-declaration.cjs
            /scripts/kit/lib/latest-run.cjs
            /scripts/kit/lib/head-authorization.cjs
            /scripts/kit/lib/head-authorization-core.cjs
          sparse-checkout-cone-mode: false

      - name: Evaluate green PRs
        id: evaluate
        if: needs.preflight.outputs.policy_ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { evaluate } = require('./scripts/kit/lib/merge-gate.cjs');
            const { policyFromEnv } = require('./scripts/kit/lib/head-authorization.cjs');
            const { toMerge, unreadable } = await evaluate({
              github, repo: context.repo, payload: context.payload, core, policy: policyFromEnv(process.env),
            });
            core.setOutput('to_merge', JSON.stringify(toMerge));
            core.setOutput('unreadable', JSON.stringify(unreadable));

      # Minting after preselection is hygiene, not the authorization boundary. It intentionally runs
      # on every enabled evaluation so docs/kit/ci-app-setup.md can confirm the App by dispatch.
      # The App client only merges; all fresh verdict reads retain the read-only token.
      - name: Mint app token (kit-ci)
        id: app
        if: ${{ !cancelled() && steps.cfg.outputs.enabled == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # client-id accepts the numeric App ID; this is the documented kit-ci setup path.
          client-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Merge green PRs
        id: merge
        if: >-
          steps.cfg.outputs.enabled == 'true' &&
          steps.app.outcome == 'success' &&
          steps.evaluate.outputs.to_merge != '' &&
          steps.evaluate.outputs.to_merge != '[]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TO_MERGE: ${{ steps.evaluate.outputs.to_merge }}
          MERGE_TOKEN: ${{ steps.app.outputs.token }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { land } = require('./scripts/kit/lib/merge-gate.cjs');
            const { policyFromEnv } = require('./scripts/kit/lib/head-authorization.cjs');
            const { stale, unreadable } = await land({
              github, merger: getOctokit(process.env.MERGE_TOKEN), repo: context.repo, core, policy: policyFromEnv(process.env),
              queue: JSON.parse(process.env.TO_MERGE || '[]'),
            });
            core.setOutput('unreadable', JSON.stringify(unreadable));
            if (stale.length) {
              core.setFailed(
                `Merge refused: evaluated revision is no longer the head — ${stale.join(', ')}. Other candidates may have merged.`,
              );
            }

      - name: Fail on unreadable merge gate
        if: >-
          !cancelled() &&
          ((steps.evaluate.outputs.unreadable != '' && steps.evaluate.outputs.unreadable != '[]') ||
           (steps.merge.outputs.unreadable != '' && steps.merge.outputs.unreadable != '[]'))
        env:
          EVALUATE_UNREADABLE: ${{ steps.evaluate.outputs.unreadable }}
          MERGE_UNREADABLE: ${{ steps.merge.outputs.unreadable }}
        run: |
          echo "::error title=Merge gate unreadable::held, GitHub could not answer for: evaluate=${EVALUATE_UNREADABLE:-[]} merge=${MERGE_UNREADABLE:-[]} (Evaluate / Merge green PRs logs)"
          exit 1

      - name: Summary
        if: always()
        env:
          ENABLED: ${{ steps.cfg.outputs.enabled }}
          TO_MERGE: ${{ steps.evaluate.outputs.to_merge }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          EVALUATE_UNREADABLE: ${{ steps.evaluate.outputs.unreadable }}
          MERGE_UNREADABLE: ${{ steps.merge.outputs.unreadable }}
        run: |
          {
            echo "## Merge on Green"
            echo ""
            if [ "$ENABLED" = "true" ]; then
              echo "- **kit-ci:** configured (auto-merge ON)"
            else
              echo "- **kit-ci:** **not configured** (auto-merge OFF — operator-authorized merge after normal admission)"
              echo "- Setup: \`docs/kit/ci-app-setup.md\`"
            fi
            if [ "$EVALUATE_OUTCOME" = "success" ]; then
              echo "- Candidates: \`${TO_MERGE:-[]}\`"
            else
              echo "- Evaluation: ${EVALUATE_OUTCOME:-not run}"
            fi
            echo "- Held, unreadable: evaluate=\`${EVALUATE_UNREADABLE:-[]}\` merge=\`${MERGE_UNREADABLE:-[]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Dependabot's capture job performs its own withdrawal before evaluation.
  # This is best effort; binding also denies a changed head when an event is missed.
  revoke-reviewed-on-push:
    name: revoke-reviewed-on-push
    needs: preflight
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.id != 49699333 &&
      (github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_AUTH_REPOSITORY_ID: ${{ vars.HEAD_AUTH_REPOSITORY_ID }}
      HEAD_AUTH_OPERATOR_IDS: ${{ vars.HEAD_AUTH_OPERATOR_IDS }}
      HEAD_AUTH_APP_ID: ${{ vars.HEAD_AUTH_APP_ID }}
      HEAD_AUTH_BOT_USER_ID: ${{ vars.HEAD_AUTH_BOT_USER_ID }}
    steps:
      - name: Report skipped revocation
        if: needs.preflight.outputs.enabled != 'true'
        run: |
          echo "::notice title=kit-ci not configured::Authorization withdrawal skipped; no token mint."
      - name: Checkout trusted authorization adapter
        if: needs.preflight.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/kit/lib/head-authorization.cjs
            /scripts/kit/lib/head-authorization-core.cjs
          sparse-checkout-cone-mode: false
      - name: Mint repository-scoped app token
        id: app
        if: needs.preflight.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Withdraw authorization and remove reviewed hint
        if: needs.preflight.outputs.enabled == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WRITE_TOKEN: ${{ steps.app.outputs.token }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { policyFromEnv, withdrawAuthorization } = require('./scripts/kit/lib/head-authorization.cjs');
            const writer = getOctokit(process.env.WRITE_TOKEN);
            const prNumber = context.payload.pull_request.number;
            await withdrawAuthorization({
              github, writer, repo: context.repo, prNumber, policy: policyFromEnv(process.env),
              operationId: `merge-revoke:${context.runId}`,
              reason: `pull_request_${context.payload.action}`,
            });
            try {
              await writer.rest.issues.removeLabel({ ...context.repo, issue_number: prNumber, name: 'reviewed' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
