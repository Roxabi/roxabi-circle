name: CI

# Gate qualité (validate:full). Ne déploie pas.
#
# Quand ça tourne :
#   - pull_request → staging|main  = gate avant merge (ready only; draft skipped)
#   - push staging|main            = validation post-merge
#   - workflow_dispatch            = secours manuel
# Pas de CI sur feat/* sans PR vers staging|main.
# Draft PRs: no heavy CI (ready_for_review starts the gate).
on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege — same spirit as secret-scan / merge-on-green.
permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Name is matched by merge-on-green (regex validate-full). Do not rename without updating that workflow.
    name: validate-full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pin SHAs (supply-chain); tags float.
      # fetch-depth 0: product zero-edit needs kit baseline commit reachable (docs/product/kit-baseline).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Kit origin: zero-edit kit mode (config only). Product clones: no upstream remote on
      # Actions — point ZERO_EDIT_BASE_REF at last-merged kit tip (docs/product/kit-baseline).
      # See docs/product-consumer-contract.md § CI zero-edit base.
      - name: Validate full
        run: |
          set -euo pipefail
          # Brand-agnostic: product trees ship docs/product/kit-baseline; kit trees do not.
          if [[ -f docs/product/kit-baseline ]]; then
            export ZERO_EDIT_BASE_REF
            ZERO_EDIT_BASE_REF="$(tr -d '[:space:]' < docs/product/kit-baseline)"
            if ! git rev-parse --verify "${ZERO_EDIT_BASE_REF}^{commit}" >/dev/null 2>&1; then
              echo "::error::kit-baseline ${ZERO_EDIT_BASE_REF} not in history — fetch-depth/full history or re-merge upstream"
              exit 1
            fi
            echo "ZERO_EDIT_BASE_REF=${ZERO_EDIT_BASE_REF}"
          fi
          bun run validate:full

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/**/coverage-summary.json
            coverage/**/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # Showcase CD = Cloudflare Builds (git pull), not GH deploy. See docs/deploy-cloudflare.md.
  # Browser e2e is local-only (Free CI minutes + flake risk).
  # Local: bun run test:e2e:design-system (servers up) or bun run test:e2e:ci (one-shot).
  # Not in validate:full / Lefthook. See docs/testing.md CP-E2E.
