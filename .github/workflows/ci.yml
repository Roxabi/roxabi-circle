name: CI

# Gate qualité (`bun run validate:full`). Ne déploie pas.
#
# Quand ça tourne :
#   - pull_request → staging|main  = gate avant merge (ready only; draft skipped)
#   - push staging|main            = suite seulement si commit nu (classify=naked)
#   - workflow_dispatch            = secours manuel
# Pas de CI sur feat/* sans PR vers staging|main.
# Draft PRs: no heavy CI (ready_for_review starts the gate).
# Processed PR merge → skip suite (effects = Cloudflare Builds). Naked push → run suite.
# ~/projects/ssot/conventions.ssot.md § CI landing
on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege — classify reads check-runs + associated PRs.
permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  classify:
    name: Classify push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      path: ${{ steps.out.outputs.path }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path=naked
          prs="$(gh api "repos/${REPO}/commits/${SHA}/pulls")"
          # /commits/SHA/pulls omits `merged` (always null); merged_at is the signal.
          n="$(printf '%s' "$prs" | jq --arg sha "$SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | length')"
          if [ "$n" -gt 0 ]; then
            head="$(printf '%s' "$prs" | jq -r --arg sha "$SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)][0].head.sha')"
            conc="$(gh api --paginate "repos/${REPO}/commits/${head}/check-runs" --jq '[.check_runs[] | select((.name | ascii_downcase) == "ci") | .conclusion] | map(select(. == "success")) | if length > 0 then "success" else "missing" end')"
            if [ "$conc" = "success" ]; then
              path=pr-merge
            fi
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "landing path: ${path}"

  quality:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    # Check display name `ci` — classify + merge-on-green + checkup. Do not rename without both.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pin SHAs (supply-chain); tags float.
      # fetch-depth 0: product zero-edit needs inheritance commit reachable (ADR-0009).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Kit origin: zero-edit kit mode (allowlist). Product: checker reads
      # config/product/inheritance.json (or transitional docs/product/kit-baseline).
      # See docs/kit/product-consumer-contract.md · ADR-0009.
      - name: Validate full
        run: |
          set -euo pipefail
          # Preflight: inherited tip must be in history (checker never auto-fetches).
          if [[ -f config/product/inheritance.json ]]; then
            SHA="$(node -e "const j=require('./config/product/inheritance.json'); process.stdout.write(String(j.upstreamCommit||'').trim())")"
            if ! git rev-parse --verify "${SHA}^{commit}" >/dev/null 2>&1; then
              echo "::error::inheritance upstreamCommit ${SHA} not in history — deepen checkout or re-merge upstream"
              exit 1
            fi
            echo "inheritance upstreamCommit=${SHA}"
          elif [[ -f docs/product/kit-baseline ]]; then
            SHA="$(tr -d '[:space:]' < docs/product/kit-baseline)"
            if ! git rev-parse --verify "${SHA}^{commit}" >/dev/null 2>&1; then
              echo "::error::kit-baseline ${SHA} not in history — deepen checkout or re-merge upstream"
              exit 1
            fi
            echo "legacy kit-baseline=${SHA}"
          fi
          bun run validate:full

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/**/coverage-summary.json
            coverage/**/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # Showcase CD = Cloudflare Builds (git pull), not GH deploy. See docs/kit/deploy-cloudflare.md.
  # Browser e2e is local-only (Free CI minutes + flake risk).
  # Local: bun run test:e2e:design-system (servers up) or bun run test:e2e:ci (one-shot).
  # Not in validate:full / Lefthook. See docs/kit/testing.md CP-E2E.
