name: CI

# Gate qualité (validate:full). Ne déploie pas.
#
# Quand ça tourne :
#   - pull_request → staging|main  = gate avant merge (ready only; draft skipped)
#   - push staging|main            = validation post-merge
#   - workflow_dispatch            = secours manuel
# Pas de CI sur feat/* sans PR vers staging|main.
# Draft PRs: no heavy CI (ready_for_review starts the gate).
on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege — same spirit as secret-scan / merge-on-green.
permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Name is matched by merge-on-green (regex validate-full). Do not rename without updating that workflow.
    name: validate-full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pin SHAs (supply-chain); tags float.
      # fetch-depth 0: product zero-edit needs kit baseline commit reachable (docs/product/kit-baseline).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Kit origin: zero-edit kit mode (config only). Product clones: no upstream remote on
      # Actions — point ZERO_EDIT_BASE_REF at last-merged kit tip (docs/product/kit-baseline).
      # See docs/product-consumer-contract.md § CI zero-edit base.
      - name: Validate full
        run: |
          set -euo pipefail
          if [[ "${{ github.repository }}" != "go-silex/silex-boilerplate" ]]; then
            if [[ ! -f docs/product/kit-baseline ]]; then
              echo "::error::missing docs/product/kit-baseline (kit tip SHA after last upstream merge)"
              exit 1
            fi
            export ZERO_EDIT_BASE_REF
            ZERO_EDIT_BASE_REF="$(tr -d '[:space:]' < docs/product/kit-baseline)"
            if ! git rev-parse --verify "${ZERO_EDIT_BASE_REF}^{commit}" >/dev/null 2>&1; then
              echo "::error::kit-baseline ${ZERO_EDIT_BASE_REF} not in history — fetch-depth/full history or re-merge upstream"
              exit 1
            fi
            echo "ZERO_EDIT_BASE_REF=${ZERO_EDIT_BASE_REF}"
          fi
          bun run validate:full

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/**/coverage-summary.json
            coverage/**/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # B7 A2 — browser smoke (Chromium). Soft-gate first land (Free private merge-on-green
  # treats any *failed* completed check as a block). Flip hard after AC-FLAKE (spec #19).
  # Soft expire: 2026-08-10 — remove continue-on-error after ≥10 green GHA runs or date.
  # Not a security control; not dual-auth / IDOR proof. Not in validate:full / Lefthook.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    # SOFT until 2026-08-10 (B7 AC-FLAKE) — job may fail without failing the workflow
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Soft-gate notice
        run: |
          echo "::notice title=e2e soft-gate::Job continue-on-error until 2026-08-10 (B7 AC-FLAKE). Not merge authority / not a security control. See docs/testing.md CP-E2E."

      - name: E2E design-system (API + web)
        run: bash scripts/e2e-ci.sh

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: |
            /tmp/gosilex-e2e-api.*.log
            /tmp/gosilex-e2e-web.*.log
          retention-days: 7
          if-no-files-found: ignore
