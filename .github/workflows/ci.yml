name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — same spirit as secret-scan / merge-on-green.
permissions:
  contents: read

jobs:
  quality:
    # Name is matched by merge-on-green (regex validate-full). Do not rename without updating that workflow.
    name: validate-full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pin SHAs (supply-chain); tags float.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Single entrypoint = local pre-push (docs/testing.md).
      # Includes lint · typecheck · banlist · extract · env · coverage · license · build:kit · smoke:mcp
      - name: Validate full
        run: bun run validate:full

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
