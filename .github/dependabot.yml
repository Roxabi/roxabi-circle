# Dependabot — bun.lock + GitHub Actions.
# Cooldown 3d on patch/minor (fleet convention). github-actions: default-days only
# (semver-*-days rejected by GitHub for that ecosystem).
# Ref: kit-marketplace dependabot + checkup dependabot-cooldown tests.
#
# IMPORTANT: cooldown applies to VERSION updates only — NOT security/CVE updates.
# Security alerts open immediately; Slack: .github/workflows/dependabot-alert-slack.yml
# See docs/kit/security-dependabot.md
#
# Grouping policy (kit deps waves 2026-08):
# - patch/minor bun → bun-dependencies
# - major vitest + @vitest/* → one PR
# - major @commitlint/* → one PR
# - major github-actions → one PR
# - trufflesecurity/trufflehog — ignored (SSoT `config/kit/trufflehog.version`; action-only PRs fail `--assert-pin`)
# - major zod / typescript / fastmcp / lucide-react → individual PRs (no group)
# - wrangler — leaves the group: one PR of its own, never auto-labeled (dependabot-automerge.yml). The committed
#   apps/*/src/worker-configuration.d.ts is generated by `wrangler types` and `wrangler types --check` (in each app's
#   `typecheck`) fails after any wrangler bump until it is regenerated (`bun run types` in apps/example-api and
#   apps/mcp-example), so agents regenerate and obtain independent review before normal authorized landing.
#
# Supply-chain layers around these PRs (docs/kit/security-dependabot.md § Install-time layers, § Auto-merge guard):
# - cooldown below = bunfig.toml `minimumReleaseAge` (259200 s = 3 d). Keep both equal: check-deps-guard.ts reads the
#   bunfig value as the guard's age threshold, and test:deps-guard fails when they drift from `default-days` here.
# - deps-automerge is only applied after scripts/kit/check-deps-guard.ts passes (provenance, publisher, install
#   scripts, age incl. security updates, advisories, unpinned/impostor action SHAs).
#
# Ecosystem is bun (not npm): the npm updater edits package.json and leaves
# bun.lock stale, so CI `bun install --frozen-lockfile` fails before the suite.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-dependencies:
        patterns:
          - "*"
        # Majors excluded from the group → individual PRs (independent-agent review),
        # except explicit major groups below.
        update-types:
          - minor
          - patch
        # wrangler: own PR (see header) — regenerate worker-configuration.d.ts before merge.
        exclude-patterns:
          - "wrangler"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
      commitlint:
        patterns:
          - "@commitlint/*"
        update-types:
          - major
    ignore:
      # Temporary Markdown semantics hold; remove after the evidence in Roxabi/roxabi-boilerplate-cf#549 passes.
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # v9 rewrites the API (useTable + tableFeatures). Migrate via issue, not a bump.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors together (checkout + upload-artifact etc.) — one reviewable PR.
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # SSoT is config/kit/trufflehog.version (version + checksums + action_sha).
      # Dependabot only rewrites secret-scan.yml → `--assert-pin` red (Roxabi/roxabi-boilerplate-cf#83).
      # Bump: update the pin file and both `uses:` lines together (Roxabi/roxabi-boilerplate-cf#170).
      # Security updates are not covered by ignore — those PRs fail the same
      # pin; close and bump SSoT. Alerts stay in the Security tab.
      - dependency-name: "trufflesecurity/trufflehog"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # github-actions supports ONLY default-days — semver-*-days fail the whole file.
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - ci
