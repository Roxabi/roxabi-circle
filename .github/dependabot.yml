# Dependabot — bun.lock + GitHub Actions.
# Cooldown 3d on patch/minor (fleet convention). github-actions: default-days only
# (semver-*-days rejected by GitHub for that ecosystem).
# Ref: kit-marketplace dependabot + checkup dependabot-cooldown tests.
#
# IMPORTANT: cooldown applies to VERSION updates only — NOT security/CVE updates.
# Security alerts open immediately; Slack: .github/workflows/dependabot-alert-slack.yml
# See docs/security-dependabot.md
#
# Grouping policy (kit deps waves 2026-08):
# - patch/minor bun → bun-dependencies
# - major vitest + @vitest/* → one PR
# - major @commitlint/* → one PR
# - major github-actions → one PR
# - major zod / typescript / fastmcp / lucide-react → individual PRs (no group)
#
# Ecosystem is bun (not npm): the npm updater edits package.json and leaves
# bun.lock stale, so CI `bun install --frozen-lockfile` fails before the suite.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-dependencies:
        patterns:
          - "*"
        # Majors excluded from the group → individual PRs (human review),
        # except explicit major groups below.
        update-types:
          - minor
          - patch
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
      commitlint:
        patterns:
          - "@commitlint/*"
        update-types:
          - major
    ignore:
      # v9 rewrites the API (useTable + tableFeatures). Migrate via issue, not a bump.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # v5 drops dated entrypoints; CF recommends `wrangler types` vs the package.
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors together (checkout + upload-artifact etc.) — one reviewable PR.
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
    # github-actions supports ONLY default-days — semver-*-days fail the whole file.
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - ci
