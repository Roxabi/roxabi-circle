# Dependabot — npm (bun.lock) + GitHub Actions.
# Cooldown 3d on patch/minor (fleet convention). github-actions: default-days only
# (semver-*-days rejected by GitHub for that ecosystem).
# Ref: roxabi-marketplace dependabot + checkup dependabot-cooldown tests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
        # Majors excluded from the group → individual PRs (human review).
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # github-actions supports ONLY default-days — semver-*-days fail the whole file.
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - ci
